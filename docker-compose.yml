# ============================================================
# OwnAI – Docker Compose
# Usage: docker compose up -d
# ============================================================

services:
  ownai:
    build: .
    image: ownai:latest
    container_name: ownai
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - FLASK_ENV=${FLASK_ENV:-production}
    volumes:
      # Persist trained models between container restarts
      - ./models_dir:/app/models_dir
      # Persist uploaded datasets
      - ./uploads:/app/uploads
      # Persist the SQLite database
      - ./ownai.db:/app/ownai.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/system/info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

